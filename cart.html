<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHOPIFY | Cart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #fff3f7, #fffaf2);
            min-height: 100vh;
            color: #333;
        }

        header {
            height: 74px;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #e7a3bc;
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #e7a3bc;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 45px 0 70px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title h1 {
            font-family: "Playfair Display", serif;
            font-size: 42px;
        }

        .page-title p {
            color: #777;
            margin-top: 8px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            align-items: start;
        }

        .cart-items {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 20px;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item img {
            width: 100px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            background: #f5f5f5;
        }

        .item-name {
            font-family: "Playfair Display", serif;
            font-size: 21px;
            margin-bottom: 5px;
        }

        .item-category {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .item-price {
            font-weight: 600;
            font-size: 17px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .quantity-box button {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity-box button:hover {
            background: #111;
            color: white;
        }

        .quantity {
            min-width: 25px;
            text-align: center;
        }

        .remove-button {
            margin-top: 12px;
            border: none;
            background: transparent;
            color: #c75b75;
            cursor: pointer;
            font-size: 13px;
        }

        .remove-button:hover {
            text-decoration: underline;
        }

        .summary {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            position: sticky;
            top: 20px;
        }

        .summary h2 {
            font-family: "Playfair Display", serif;
            font-size: 26px;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 17px 0;
            color: #555;
        }

        .summary-row.total {
            border-top: 1px solid #ddd;
            padding-top: 20px;
            font-size: 20px;
            font-weight: 600;
            color: #222;
        }

        .checkout-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #111;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .checkout-button:hover {
            background: #333;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .empty-cart {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-cart h2 {
            font-family: "Playfair Display", serif;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-button {
            display: inline-block;
            padding: 13px 25px;
            background: #111;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        @media (max-width: 800px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }

            nav {
                gap: 12px;
            }

        }

    </style>
</head>

<body>

    <header>

        <div class="logo">
            SHOP<span>IFY</span>
        </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="admin.html">Admin</a>
        </nav>

    </header>

    <main class="container">

        <div class="page-title">
            <h1>Shopping Cart</h1>
            <p>Review your selected items</p>
        </div>

        <div class="cart-layout">

            <div class="cart-items">
                <div id="cartContainer"></div>
            </div>

            <div class="summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Items</span>
                    <span id="itemCount">0</span>
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span id="delivery">₹0</span>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>

                <button
                    class="checkout-button"
                    onclick="checkout()">
                    PROCEED TO CHECKOUT
                </button>

                <a
                    href="products.html"
                    class="back-link">
                    ← Continue Shopping
                </a>

            </div>

        </div>

    </main>

    <script>

        /* LOGIN CHECK */

        const isLoggedIn =
            localStorage.getItem("isLoggedIn");

        const currentUser =
            localStorage.getItem("currentUser");

        if (
            isLoggedIn !== "true" ||
            !currentUser
        ) {
            window.location.href = "/login";
        }


        /* USER CART */

        const cartKey =
            "cart_" + currentUser;


        function getCart() {

            try {

                return JSON.parse(
                    localStorage.getItem(cartKey)
                ) || [];

            } catch (error) {

                console.error(error);

                return [];

            }
        }


        function saveCart(cart) {

            localStorage.setItem(
                cartKey,
                JSON.stringify(cart)
            );

        }


        /* DISPLAY CART */

        function displayCart() {

            const cart = getCart();

            const container =
                document.getElementById("cartContainer");

            const itemCount =
                document.getElementById("itemCount");

            const subtotalElement =
                document.getElementById("subtotal");

            const deliveryElement =
                document.getElementById("delivery");

            const totalElement =
                document.getElementById("total");


            if (cart.length === 0) {

                container.innerHTML = `

                    <div class="empty-cart">

                        <h2>Your cart is empty</h2>

                        <p>
                            You haven't added any products yet.
                        </p>

                        <a
                            href="/products"
                            class="shop-button">
                            SHOP NOW
                        </a>

                    </div>

                `;

                itemCount.textContent = "0";
                subtotalElement.textContent = "₹0";
                deliveryElement.textContent = "₹0";
                totalElement.textContent = "₹0";

                return;
            }


            let subtotal = 0;
            let totalItems = 0;

            container.innerHTML = "";


            cart.forEach(function(item, index) {

                const price =
                    Number(item.price) || 0;

                const quantity =
                    Number(item.quantity) || 1;

                subtotal +=
                    price * quantity;

                totalItems += quantity;


                const div =
                    document.createElement("div");

                div.className = "cart-item";


                div.innerHTML = `

                    <img
                        src="${item.image || ""}"
                        alt="${item.name || "Product"}"
                    >

                    <div>

                        <div class="item-name">
                            ${item.name || "Product"}
                        </div>

                        <div class="item-category">
                            ${item.category || ""}
                        </div>

                        <div class="item-price">
                            ₹${price}
                        </div>

                        <div class="quantity-box">

                            <button
                                onclick="decreaseQuantity(${index})">
                                −
                            </button>

                            <span class="quantity">
                                ${quantity}
                            </span>

                            <button
                                onclick="increaseQuantity(${index})">
                                +
                            </button>

                        </div>

                        <button
                            class="remove-button"
                            onclick="removeItem(${index})">
                            Remove
                        </button>

                    </div>

                `;

                container.appendChild(div);

            });


            const delivery =
                subtotal >= 999 ? 0 : 49;

            const total =
                subtotal + delivery;


            itemCount.textContent =
                totalItems;

            subtotalElement.textContent =
                "₹" + subtotal;

            deliveryElement.textContent =
                delivery === 0
                    ? "FREE"
                    : "₹" + delivery;

            totalElement.textContent =
                "₹" + total;

        }


        /* INCREASE */

        function increaseQuantity(index) {

            const cart = getCart();

            if (!cart[index]) return;

            cart[index].quantity =
                (Number(cart[index].quantity) || 1) + 1;

            saveCart(cart);

            displayCart();

        }


        /* DECREASE */

        function decreaseQuantity(index) {

            const cart = getCart();

            if (!cart[index]) return;

            const quantity =
                Number(cart[index].quantity) || 1;

            if (quantity > 1) {

                cart[index].quantity =
                    quantity - 1;

            } else {

                cart.splice(index, 1);

            }

            saveCart(cart);

            displayCart();

        }


        /* REMOVE */

        function removeItem(index) {

            const cart = getCart();

            if (!cart[index]) return;

            const name =
                cart[index].name || "Product";

            if (
                confirm(
                    "Remove " +
                    name +
                    " from your cart?"
                )
            ) {

                cart.splice(index, 1);

                saveCart(cart);

                displayCart();

            }

        }


        /* CHECKOUT */

        function checkout() {

            const cart = getCart();

            if (cart.length === 0) {

                alert(
                    "Your cart is empty. Please add products first."
                );

                return;
            }

            window.location.href =
                "/billing";

        }


        /* START */

        displayCart();

    </script>

</body>

</html>
