<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SHOPIFY | Create Account</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="login-page">

    <!-- BACKGROUND -->

    <div class="background">

        <div class="blob blob1"></div>

        <div class="blob blob2"></div>

        <div class="blob blob3"></div>

    </div>


    <!-- SIGNUP CONTAINER -->

    <div class="login-container">

        <!-- BRAND -->

        <div class="brand">

            <h1>
                SHOP<span>IFY</span>
            </h1>

            <p>
                FASHION STORE
            </p>

        </div>


        <!-- SIGNUP CARD -->

        <div class="login-card">

            <h2>
                Create Account
            </h2>

            <p class="login-subtitle">
                Join SHOPIFY and start shopping
            </p>


            <!-- SIGNUP FORM -->

            <form id="signupForm">

                <!-- NAME -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- TERMS -->

                <div class="login-options">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the terms & conditions

                    </label>

                </div>


                <!-- CREATE ACCOUNT -->

                <button
                    type="submit"
                    class="login-button"
                >
                    CREATE ACCOUNT
                </button>

            </form>


            <!-- DIVIDER -->

            <div class="divider">

                <span>OR</span>

            </div>


            <!-- LOGIN LINK -->

            <p class="signup-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>


    <!-- AUTH SCRIPT -->

    <script src="js/auth.js"></script>

</body>

</html>
