<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHOPIFY | Admin Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(
                135deg,
                #fff1f6,
                #f5edff,
                #fff8ed
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            font-family: "Playfair Display", serif;
            font-size: 42px;
            color: #222;
        }

        .brand h1 span {
            color: #d85c8a;
        }

        .brand p {
            letter-spacing: 4px;
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        .admin-card {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.12);
        }

        .admin-card h2 {
            font-family: "Playfair Display", serif;
            font-size: 30px;
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;

            border: 1px solid #ddd;
            border-radius: 12px;

            font-family: "Poppins", sans-serif;
            font-size: 14px;

            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #d85c8a;

            box-shadow:
                0 0 0 3px rgba(216,92,138,0.10);
        }

        .admin-login-btn {
            width: 100%;
            border: none;

            padding: 14px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #d85c8a,
                    #b84f9a
                );

            color: white;

            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-size: 14px;

            cursor: pointer;

            transition: 0.3s;
        }

        .admin-login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(216,92,138,0.3);
        }

        .admin-note {
            text-align: center;
            margin-top: 22px;
            font-size: 11px;
            color: #999;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;

            text-decoration: none;
            color: #d85c8a;

            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media(max-width: 500px) {

            .admin-card {
                padding: 30px 22px;
            }

            .brand h1 {
                font-size: 36px;
            }

        }

    </style>
</head>

<body>

    <div class="admin-container">

        <!-- BRAND -->

        <div class="brand">

            <h1>
                SHOP<span>IFY</span>
            </h1>

            <p>
                FASHION STORE
            </p>

        </div>


        <!-- ADMIN LOGIN -->

        <div class="admin-card">

            <h2>
                Admin Login
            </h2>

            <p class="subtitle">
                Authorized personnel only
            </p>


            <form id="adminLoginForm">

                <div class="input-group">

                    <label for="adminId">
                        Admin ID
                    </label>

                    <input
                        type="email"
                        id="adminId"
                        placeholder="Enter admin ID"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login-btn"
                >
                    ADMIN LOGIN
                </button>

            </form>


            <p class="admin-note">
                This page is restricted to administrators.
            </p>


            <a
                href="/login.html"
                class="back-link"
            >
                ← Back to Customer Login
            </a>

        </div>

    </div>


    <script>

        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const adminId =
                    document
                    .getElementById("adminId")
                    .value
                    .trim()
                    .toLowerCase();


                const password =
                    document
                    .getElementById("adminPassword")
                    .value
                    .trim();


                const correctId =
                    "monishac1175@gmail.com";

                const correctPassword =
                    "monichetu";


                if (
                    adminId === correctId &&
                    password === correctPassword
                ) {

                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    window.location.href =
                        "/admin-dashboard.html";

                }

                else {

                    alert(
                        "Invalid Admin ID or Password."
                    );

                }

            });

    </script>

</body>
</html>
