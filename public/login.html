<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SHOPIFY | Login</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="login-page">

    <!-- BACKGROUND -->

    <div class="background">

        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>

    </div>


    <!-- LOGIN CONTAINER -->

    <div class="login-container">

        <!-- BRAND -->

        <div class="brand">

            <h1>
                SHOP<span>IFY</span>
            </h1>

            <p>
                FASHION STORE
            </p>

        </div>


        <!-- LOGIN CARD -->

        <div class="login-card">

            <h2>
                Welcome Back
            </h2>

            <p class="login-subtitle">
                Login to continue shopping
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- REMEMBER -->

                <div class="login-options">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button">

                    LOGIN

                </button>

            </form>


            <!-- DIVIDER -->

            <div class="divider">

                <span>OR</span>

            </div>


            <!-- SIGNUP -->

            <p class="signup-link">

                Don't have an account?

                <a href="/signup">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
